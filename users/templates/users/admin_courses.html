{% extends 'users/base.html' %}{% block content %}<div class="actions"><h1 style="margin-right:auto">Cursos y matrículas</h1><a class="btn" href="{% url 'admin_create_group' %}">+ Grupo</a><a class="btn" href="{% url 'admin_create_course' %}">+ Curso</a><a class="btn gold" href="{% url 'admin_enroll' %}">+ Matricular</a></div><div class="card"><table><tr><th>Curso</th><th>Programa / grupo</th><th>Docente</th><th>Estudiantes</th></tr>{% for c in cursos %}<tr><td>{{ c.name }}</td><td>{{ c.grupo }}</td><td>{{ c.teacher }}</td><td>{{ c.enrollments.count }}</td></tr>{% empty %}<tr><td colspan="4">No hay cursos.</td></tr>{% endfor %}</table></div>{% endblock %}
