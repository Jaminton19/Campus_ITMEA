{% extends 'users/base.html' %}{% block content %}<h1>Reportes administrativos</h1><div class="card"><p>Total matrículas: <b>{{ enrollments|length }}</b></p><table><tr><th>Estudiante</th><th>Curso</th><th>Nota final</th></tr>{% for e in enrollments %}<tr><td>{{ e.student }}</td><td>{{ e.curso }}</td><td>{{ e.grade|default:'Pendiente' }}</td></tr>{% endfor %}</table></div>{% endblock %}
