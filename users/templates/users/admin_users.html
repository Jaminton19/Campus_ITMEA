{% extends 'users/base.html' %}{% block content %}<div class="actions"><h1 style="margin-right:auto">Usuarios</h1><a class="btn" href="{% url 'admin_create_user' %}">+ Crear usuario</a></div><div class="card"><table><tr><th>Usuario</th><th>Nombre</th><th>Correo</th><th>Rol</th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.full_name|default:'-' }}</td><td>{{ u.email|default:'-' }}</td><td><span class="pill">{{ u.get_role_display }}</span></td></tr>{% endfor %}</table></div>{% endblock %}
