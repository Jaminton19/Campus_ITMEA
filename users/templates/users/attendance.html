{% extends 'users/base.html' %}{% load campus_tags %}{% block content %}<h1>Asistencia · {{ curso.name }}</h1><div class="card"><form method="post">{% csrf_token %}<label>Fecha</label><input type="date" name="date" value="{{ date }}"><table><tr><th>Estudiante</th><th>Presente</th><th>Observación</th></tr>{% for s in students %}{% with r=records|get_item:s.id %}<tr><td>{{ s.full_name|default:s.username }}</td><td><input style="width:auto" type="checkbox" name="present_{{ s.id }}" {% if r.present or not r %}checked{% endif %}></td><td><input name="obs_{{ s.id }}" value="{{ r.observation|default:'' }}"></td></tr>{% endwith %}{% endfor %}</table><button class="btn" type="submit">Guardar asistencia</button></form></div>{% endblock %}
