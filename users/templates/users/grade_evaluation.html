{% extends 'users/base.html' %}{% load campus_tags %}{% block content %}<h1>Calificar: {{ evaluation.title }}</h1><div class="card"><form method="post">{% csrf_token %}<table><tr><th>Estudiante</th><th>Nota</th><th>Observación</th></tr>{% for s in students %}{% with g=grades|get_item:s.id %}<tr><td>{{ s.full_name|default:s.username }}</td><td><input name="grade_{{ s.id }}" value="{{ g.grade|default:'' }}"></td><td><input name="obs_{{ s.id }}" value="{{ g.observation|default:'' }}"></td></tr>{% endwith %}{% endfor %}</table><button class="btn" type="submit">Guardar</button></form></div>{% endblock %}
