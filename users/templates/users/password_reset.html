{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuperar contraseña</title>
</head>
<body>
<h1>Recuperar contraseña</h1>
<p>Ingresa tu correo electrónico y recibirás un enlace para restablecer tu contraseña.</p>

<form method="post">
  {% csrf_token %}
  {{ form.email.label_tag }}<br>
  {{ form.email }}<br><br>
  <button type="submit">Enviar enlace</button>
</form>

<a href="{% url 'login' %}">Volver al login</a>
</body>
</html>
