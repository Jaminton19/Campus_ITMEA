{% extends 'users/base.html' %}{% block content %}<h1>Mis estudiantes</h1><div class="card"><table><tr><th>Nombre</th><th>Usuario</th><th>Correo</th></tr>{% for s in students %}<tr><td>{{ s.full_name|default:'-' }}</td><td>{{ s.username }}</td><td>{{ s.email }}</td></tr>{% empty %}<tr><td colspan="3">No hay estudiantes.</td></tr>{% endfor %}</table></div>{% endblock %}
